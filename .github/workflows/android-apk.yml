name: Build Android APK

# 수동 실행: Actions 탭 → Build Android APK → Run workflow
# 빌드된 디버그 APK는 실행 결과(run)의 Artifacts에서 다운로드합니다.
#
# 환경변수는 Vercel 프로젝트(ad-gas)에서 직접 끌어옵니다(vercel env pull).
# 따라서 GitHub Actions에는 토큰 1개(VERCEL_TOKEN)만 추가하면 됩니다.
on:
  workflow_dispatch:
    inputs:
      use_test_ads:
        description: 'AdMob 테스트 광고 사용 (true/false)'
        default: 'true'

permissions:
  contents: read

env:
  # 비밀 아님(공개 식별자). Vercel 프로젝트 ad-gas.
  VERCEL_ORG_ID: team_s8ew59VizFsHeaYvpDJIJ0DV
  VERCEL_PROJECT_ID: prj_YpWh8gJHfP8FzgpFoXFf45Xs0aCQ

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Token presence (no values shown)
        run: |
          echo "VERCEL_TOKEN set: ${{ secrets.VERCEL_TOKEN != '' }}"
          echo "(VERCEL_TOKEN 이 false 면 GitHub 저장소 Actions Secret 에 VERCEL_TOKEN 을 추가하세요)"

  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Pull env vars from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN 이 설정되지 않았습니다. GitHub 저장소 Settings → Secrets and variables → Actions → Repository secrets 에 VERCEL_TOKEN 을 추가하세요."
            exit 1
          fi
          npx --yes vercel@latest env pull .env.local \
            --environment=production \
            --token="$VERCEL_TOKEN" --yes
          echo "Pulled the following env keys (values hidden):"
          grep -oE '^[A-Za-z0-9_]+' .env.local | sort | sed 's/^/  /'

      - name: Build web (static export)
        env:
          # 테스트 광고 여부는 실행 입력값으로 덮어씀(.env.local 값보다 우선)
          NEXT_PUBLIC_ADMOB_USE_TEST_ADS: ${{ github.event.inputs.use_test_ads }}
        run: npm run build:mobile

      - name: Add Android platform
        run: npx cap add android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          ADMOB_APP_ID=$(grep -E '^ADMOB_APP_ID=' .env.local 2>/dev/null | head -1 | cut -d= -f2- | sed 's/^"//; s/"$//')
          if [ -z "$ADMOB_APP_ID" ]; then
            echo "::warning::ADMOB_APP_ID 가 Vercel 환경변수에 없습니다. 구글 테스트 앱 ID로 대체합니다."
            ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          ADMOB_APP_ID="$ADMOB_APP_ID" node -e "
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let x = fs.readFileSync(p, 'utf8');
          const id = process.env.ADMOB_APP_ID;
          if (!x.includes('com.google.android.gms.ads.APPLICATION_ID')) {
            const meta = '        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"' + id + '\"/>\n    </application>';
            x = x.replace('</application>', meta);
            fs.writeFileSync(p, x);
          }
          console.log('AdMob APPLICATION_ID injected (length ' + id.length + ')');
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-gas-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
